name: offline-tests

# 只跑**离线**套件: 不需要任何 API key, 不联网。
#
# 刻意排除 `tests/test_judge_golden.py` —— 它要打真实模型网关, 而且在
# 判定边界上目前**不稳定**(同样的代码同样的 temperature, FP/FN 会翻),
# 所以它无法用来判断回归。模型评测应该另开一个手动/定时的 workflow,
# 不要混进这个"每次 push 都必须绿"的硬检查。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 同步依赖(锁定版本)
        run: uv sync --frozen

      # test_web 验的是**真实浏览器布局**, 所以必须有浏览器。
      # ubuntu-latest 的镜像预装了 Chrome, 这里只把它显式暴露出来 ——
      # 早先测试里写死了 Windows 路径, 在 CI 上必然找不到。
      - name: 定位 Chrome
        run: |
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            p="$(command -v "$c" || true)"
            if [ -n "$p" ]; then
              echo "找到浏览器: $p"
              echo "HGT_CHROME=$p" >> "$GITHUB_ENV"
              "$p" --version
              exit 0
            fi
          done
          echo "::error::runner 上没有可用的 Chrome/Chromium"
          exit 1

      # 逐个跑, 不用 `&&` 串联 —— 这样失败时能一眼看出是哪个套件挂的。
      - name: 离线套件 puzzle
        run: uv run tests/test_puzzle.py

      - name: 离线套件 parser
        run: uv run tests/test_parser.py

      - name: 离线套件 llm
        run: uv run tests/test_llm.py

      # Issue #23: **按调用阶段配置可插拔模型路由**。
      #
      # 守三类东西:
      #   (a) 优先级 —— CLI stage > CLI --model > AI_MODEL_<STAGE> > AI_MODEL
      #       > 代码默认。其中 `--model X` 必须**清掉** env 里的 stage
      #       override, 否则旧脚本里的"整场全用 X"会被某个遗留环境变量
      #       偷偷改掉一部分 stage;
      #   (b) 错配告警按 (stage, requested, actual) 三元组独立记账 ——
      #       一个全局 bool 会让第一个错配吞掉后面所有 stage 的;
      #   (c) **兜底守卫**: 新增生产 `client.messages()` 若忘了传 stage,
      #       套件必须变红 —— 不带 stage 的调用会静默落回全局模型,
      #       配置看着生效而那一环没走路由, 行为层完全看不出来。
      - name: 离线套件 llm_stage_routing
        run: uv run tests/test_llm_stage_routing.py

      - name: 离线套件 engine
        run: uv run tests/test_engine.py

      - name: 离线套件 ingest
        run: uv run tests/test_ingest.py

      - name: 离线套件 web
        run: uv run tests/test_web.py

      - name: 离线套件 leaderboard_bridge
        run: uv run tests/test_leaderboard_bridge.py

      # Step 05: 用 Step 00 冻结的真实 fixture 跑 canonical regression。
      # **只证明当前错误存在**, 不修 —— 修在 Step 07。
      - name: 离线套件 canonical
        run: uv run tests/test_canonical.py

      - name: 离线套件 pool
        run: uv run tests/test_pool.py

      # G4-2: **统一默认直播题源**(任务书 §九 的 14 条)。它守的是
      # "默认不看 curated / 默认只用 keyword2" —— 一组**否定性**命题,
      # 而否定性命题最容易假绿(把 curated 整个删掉也能让它们通过)。
      # 所以每条都配了反证: `--curated` 时确实加载 / 确实排除了。
      #
      # 另外两条值得单列:
      #   * **prewarm** 有界且失败不阻止启动 —— 预热是优化, 不是可用性
      #     前提; 让它能把进程卡死就是把优化写成了单点故障。
      #   * **banner** 打印题源模式 —— §二 要求的可观测性落点。它顺带
      #     钉住了"banner 真的会被打出来"(修之前 `print()` 要等进程退出
      #     才 flush, `| head` / 重定向时**整个 banner 消失**)。
      - name: 离线套件 g4_source
        run: uv run tests/test_g4_source.py

      # G2: keyword2 两阶段起题的**零件** —— 抽词。它守三件事:
      #   (a) 生产抽词与 G1 实验是**同一份实现**(否则 G1 的结论不再描述
      #       生产行为), 且依赖方向只能是 `story/ <- tools/`;
      #   (b) 抽取序列与 G1 基线**逐字节相同**(md5 钉死) —— 改词库/改抽取
      #       方式会让两批历史数据无法对比;
      #   (c) 本模块不碰 `random` 的全局状态(否则会污染 live 出题的序列)。
      #
      # G3 追加: **关键词来源**换成真实 haiguitang input 之后要守的 ——
      #   (d) corpus 只从 `input` 提词(改 output 不得影响 pair 表);
      #   (e) 只留恰好 2-key / pair 去重 / 不带频率;
      #   (f) bag 同 session seed 顺序可复现, 且一个 bag 内不重复;
      #   (g) **corpus 缺失/空/损坏 -> 抛错(由调用方显式降级)**,
      #       `keyword_corpus.py` 里不得出现 `KEYWORD_BANK` 兜底。
      #   ⚠️ (g) 是最要紧的一条: 它挡的是"看起来在跑 keyword2, 其实
      #   偷偷用人工词库"。那种故障在行为层**看不出来**(题照样进池)。
      - name: 离线套件 keyword_seed
        run: uv run tests/test_keyword_seed.py

      - name: 离线套件 prefetch
        run: uv run tests/test_prefetch.py

      - name: 离线套件 playtest
        run: uv run tests/test_playtest.py

      # Step 10: PublicPlayerCore 的**结构性**隔离(签名反射 + 属性检查)。
      - name: 离线套件 public_player
        run: uv run tests/test_public_player.py

      # Step 12A: 守住「外部协议证据」这份文件的性质(非实测、字段编号与
      # 本地 proto 一致)。它防的是后续模型把猜测洗成证据。
      - name: 离线套件 protocol_evidence
        run: uv run tests/test_protocol_evidence.py

      # Step 13A: SummonLedger(Like high-water + 通用账本)。礼物不换算。
      - name: 离线套件 summon
        run: uv run tests/test_summon.py

      # Step 12B: 本地生成的 WS bootstrap(纯函数, 外部实现用法)。
      - name: 离线套件 ws_bootstrap
        run: uv run tests/test_ws_bootstrap.py

      # 12B-Auth: WS handshake 的登录态 Cookie(匿名/登录合并 + 防泄漏)。
      # 防泄漏那几条是硬要求: 凭据不得进 repr / 日志 / 异常 / stdout。
      - name: 离线套件 ws_cookie
        run: uv run tests/test_ws_cookie.py

      # 12C: gift_capture_diagnostic —— 多连接画像抓取 + Gift-family 原始证据。
      # 这个套件守的是 Issue「测试要求」的 13 条, 其中好几条是**否定性**
      # 命题("非 Gift method 不落盘" / "坏 cookie 不进日志" / "probe 目录
      # 与 production 不相交")—— 那类命题最容易假绿, 所以每条都配了反证。
      #
      # 最要紧的两条:
      #   * **三层计数可独立区分**(seen / parsed / emitted) —— 合并任何两层
      #     都会让"服务端没给" "parse 炸了" "回调断了" 三种故障在计数上
      #     长得一模一样;
      #   * **诊断关闭时生产计数逐字不变** —— 拿基线与诊断类跑同一个响应,
      #     比对 method/unhandled/parse_error 三个计数与业务回调序列。
      - name: 离线套件 gift_probe
        run: uv run tests/test_gift_probe.py

      # Issue #42: 礼物**识别 + 结构化记录**的回归 —— 正常直播链
      # (keep_all=False)收得到 Gift、字段映射正确、gifts.jsonl 一条
      # 消息一行(不合并连击/不去重)、每场 run 目录 collision-safe、
      # 共享 non-gzip decoder 的 fail-soft、Cookie 不进任何日志,
      # 以及 **Gift 不影响 AI 玩家额度**(earned/available 不变)。
      - name: 离线套件 gift_logging
        run: uv run tests/test_gift_logging.py

      # Solve UX: 通关合同(v5)的**产品语义**回归 —— 房间共同推理、
      # human-only established、Reviewer 四项 fail-closed、确定性揭晓、
      # 运行时身份包含合同。Cases A~M, 全部去身份化的最小构造。
      - name: 离线套件 solve_ux
        run: uv run tests/test_solve_ux.py

      # Batch H1/H2: 外部题库导入的**纯逻辑**回归 —— 版权分段(算错是
      # 法律风险)、判重归一、确定性落盘、H2-A 的 tag 过滤、安全筛查。
      # 完全离线: 假 API 替身, 不联网。
      #
      # 其中 `test_se_answer_pagination_reads_has_more` 守的是一个**真实
      # 发生过的**故障: SE 的 /answers 每页只回 30 条并带 has_more, 不
      # 翻页就会静默少拿 70% 的答案(而且不报任何错)。没有这条测试, 这
      # 类故障不会让任何断言变红。
      - name: 离线套件 curated_import
        run: uv run tests/test_curated_import.py

      # Batch H2: curated 编译器的**铁律**回归 —— "AI 是编辑, 不是出题人"。
      # 最要紧的一条是 `test_never_calls_emit_riddle`: 编译链一旦调到
      # 出题工具, 模型就有机会把原故事改掉(而 surface/bottom 是 canonical
      # source)。另含 provenance 过审不丢(审稿会**重建** spec)。
      - name: 离线套件 curated_compile
        run: uv run tests/test_curated_compile.py

      # Batch H3-A: **curated 题型准入 + 决策账本**。
      # 最要紧的一条是 `test_q10000_is_rejected_by_story_gate`: 那道
      # "卡车烧油变轻"的物理脑筋急转弯在 H2 的九条判据下**全部通过**,
      # 所以拒它的必须是新增的故事性判据。另含四条账本语义
      # (defer/interrupted 必须可重试 —— 记成 rejected 会永久吃掉
      # 一道题, 而且没有任何地方会显示丢了)。
      #
      # H3-D 起还守 four fixtures(q10000 / 十八楼按钮 / 吉普车车辙 /
      # 2<3 心形) —— 它们一律**不带标签**, 证明门是按**结构**判的,
      # 不是关键词黑名单。
      - name: 离线套件 curated_v2
        run: uv run tests/test_curated_v2.py

      # Batch H3-B/D: **Lazy Curator** —— 后台按需审题 + 直播让路。
      # 最要紧的几条:
      #   (a) phase 白名单 —— SETTING / REVEALING / STOPPED 一律不启动,
      #       否则出题(直播主线)会和后台审题抢网关;
      #   (b) 技术失败记 `technical_defer`(可重试)而**不是** `rejected`
      #       (终态) —— 写错方向会永久吃掉一道题;
      #   (c) refill cycle —— 跌破 min 就一路补到 target, 不是在 min 停;
      #   (d) `accepted` 是**最终 commit marker** —— 池/署名写不成时,
      #       append-only 历史里一条 accepted 都不能出现;
      #   (e) 装配层: curator 卡在 worker 里时 scheduler 照常推进
      #       (H3-B 那版把 LLM 放回了 tick 线程, 心跳会停)。
      - name: 离线套件 lazy_curator
        run: uv run tests/test_lazy_curator.py

      # Batch H4-A: **neurostellar/haiguitang** 主源导入器。
      # 要守的四件事:
      #   (a) deterministic sanitation 在任何 LLM **之前** —— 清洗免费,
      #       Reviewer 花钱; 顺序反了就是把预算花在残缺条目上;
      #   (b) **不伪造许可证** —— 该源没有 license 字段, 走
      #       `usage_basis=project_approved_public_dataset`, 而**不是**
      #       硬填一个 CC BY-SA / MIT;
      #   (c) 只做 **exact** 去重(这一轮明确不做语义/embedding/跨源聚类);
      #   (d) `select_candidate` 能选中项目批准的源 —— 防的是一次
      #       **silent no-op**: 下载 3729 条、normalize 成功, 然后
      #       一条都不审, 而日志上看不出异常。
      - name: 离线套件 haiguitang_import
        run: uv run tests/test_haiguitang_import.py

      # 单元测试覆盖不到的**装配**问题(线程/端口/信号/落盘接线)。
      # director 是常驻进程, 没有"跑完就退出"的模式, 所以用 timeout 兜底:
      # 正常情况一定是被 timeout 杀掉的(退出码 124), 那时看日志判定。
      # 真正的失败是启动即崩(非 0/124 的退出码)或日志里出现 Traceback。
      #
      # 用 tests/fixtures/ 里的脚本, **不要**用 data/demo_script.jsonl ——
      # 后者被 .gitignore 忽略, CI 上根本不存在。
      - name: 装配冒烟(no-llm sim, 限时)
        run: |
          set +e
          timeout 25 uv run director.py \
            --sim tests/fixtures/smoke_script.jsonl --no-llm --no-window \
            --reveal-hold 3 --max-puzzles 2 --log-file "" \
            > /tmp/smoke.log 2>&1
          code=$?
          set -e
          cat /tmp/smoke.log
          echo "---- exit=$code ----"
          if [ "$code" != "0" ] && [ "$code" != "124" ]; then
            echo "::error::冒烟启动失败(退出码 $code)"
            exit 1
          fi
          if grep -q "Traceback" /tmp/smoke.log; then
            echo "::error::冒烟日志里出现 Traceback"
            exit 1
          fi
          # 至少要走到"出题就位"——否则等于没跑起来就退了。
          if ! grep -q "题就位" /tmp/smoke.log; then
            echo "::error::冒烟没有产出任何一道题"
            exit 1
          fi
          echo "冒烟通过"
