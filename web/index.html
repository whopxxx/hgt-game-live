<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 海龟汤直播</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <div id="content">

      <!-- ============ 上半部: 谜面(大字, 固定) ============ -->
      <section id="top">
        <div id="puzzle-head">
          <span id="puzzle-index"></span>
          <!--
            题目元数据(5 大类协议 v2): "中等 · 悬疑 · 脑洞" 形式。
            内容完全由服务端 puzzle_meta 下发(中文 label 后端拥有),
            空时整个元素隐藏 —— 不显示"未知 · 未分类"。
          -->
          <span id="puzzle-meta" class="hidden"></span>
          <span id="puzzle-timer"></span>
          <span id="puzzle-elapsed"></span>
        </div>
        <div id="puzzle-viewport">
          <div id="puzzle"></div>
        </div>
      </section>

      <!-- ============ 下半部: 问答流(持续上滚) ============ -->
      <section id="bottom">
        <div id="announcer" aria-live="polite"><div id="announcer-text"></div></div>
        <div id="qa-title">问答</div>
        <div id="qa">
          <div id="qa-body"></div>
        </div>
        <div id="prompt">发送 <b>#你的问题</b> 向我提问，猜中汤底我就揭晓</div>
        <div id="thinking" class="hidden">AI 正在思考…</div>
        <div id="hintbar" class="hidden"></div>
        <div id="stats"></div>
      </section>

      <!--
        ============ 揭晓工作区(U1) ============
        ⚠️ 位置: #content 的直接子节点, **与 #top / #bottom 平级** ——
        不是嵌在 #top 里。它 position:absolute; inset:0, 所以拿到的
        是整个舞台(1080x1920), 揭晓时覆盖下半部的问答区, 而上半部的
        谜面在它之上仍可见。

        为什么必须移出来: 早先它嵌在 #top 内(靠盖住谜面工作), 而 #top
        是 overflow:hidden 且高度由 layout() 按谜面内容动态分配 ——
        完整的核心答案 + 解释根本放不下, 只能靠 fitReveal() 把字号一路
        缩到 22px。移到这里之后字号才有真正的空间。

        前 reveal_core_focus_seconds 秒只显示 #reveal-core(超大字号),
        之后 reveal_detail_visible=true 才追加 #reveal-body + 贡献链。
      -->
      <div id="reveal" class="hidden">
        <div id="reveal-label">汤底揭晓</div>
        <div id="reveal-core"></div>
        <div id="reveal-who" class="hidden"></div>
        <div id="reveal-body" class="hidden"></div>
        <!--
          Issue #60 §5: REVEALED 互动层(评分 #1~#5 / 下一题主题 #a~#e)。
          ⚠️ 前端**只渲染**服务端 reveal_interaction 快照:
            rating_open / theme_vote_open 由 Engine 判,
            前端绝不从 next_puzzle_ms 自行推断窗口。
          0~30s: 评分+主题并排; 30~60s: 评分弱化, 主题成主 CTA。
          45~60s contribution 内容仍可读(本面板不挤占正文空间)。
        -->
        <div id="reveal-interaction" class="hidden">
          <div id="rating-box" class="">
            <div id="rating-title">给本题评分：发送 #1~#5</div>
            <div id="rating-dist"></div>
          </div>
          <div id="theme-box">
            <div id="theme-title">下一题主题：发送 #a~#e（可改票）</div>
            <div id="theme-options"></div>
          </div>
        </div>
        <!--
          揭晓贡献链: "这题大家是怎么一起推出来的"。
          刻意放在正文**之后** —— 核心答案始终是视觉第一层, 贡献链是
          对它的注解, 不是第二份谜底。字号也明显小于正文。
          只在 REVEALING / REVEALED 阶段由服务端下发内容。
        -->
        <div id="reveal-contrib" class="hidden">
          <div id="reveal-contrib-title"></div>
          <div id="reveal-contrib-list"></div>
        </div>
        <div id="reveal-next"></div>
      </div>
    </div>

    <!-- 调试面板(独立列, 不遮挡内容) -->
    <div id="debug" class="hidden">
      <h3>调试</h3>
      <div id="debug-body"></div>
    </div>

    <div id="conn" class="hidden">连接中…</div>
    <div id="toast" class="hidden"></div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
