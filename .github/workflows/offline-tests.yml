name: offline-tests

# 只跑**离线**套件: 不需要任何 API key, 不联网。
#
# 刻意排除 `tests/test_judge_golden.py` —— 它要打真实模型网关, 而且在
# 判定边界上目前**不稳定**(同样的代码同样的 temperature, FP/FN 会翻),
# 所以它无法用来判断回归。模型评测应该另开一个手动/定时的 workflow,
# 不要混进这个"每次 push 都必须绿"的硬检查。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 同步依赖(锁定版本)
        run: uv sync --frozen

      # test_web 验的是**真实浏览器布局**, 所以必须有浏览器。
      # ubuntu-latest 的镜像预装了 Chrome, 这里只把它显式暴露出来 ——
      # 早先测试里写死了 Windows 路径, 在 CI 上必然找不到。
      - name: 定位 Chrome
        run: |
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            p="$(command -v "$c" || true)"
            if [ -n "$p" ]; then
              echo "找到浏览器: $p"
              echo "HGT_CHROME=$p" >> "$GITHUB_ENV"
              "$p" --version
              exit 0
            fi
          done
          echo "::error::runner 上没有可用的 Chrome/Chromium"
          exit 1

      # 逐个跑, 不用 `&&` 串联 —— 这样失败时能一眼看出是哪个套件挂的。
      - name: 离线套件 puzzle
        run: uv run tests/test_puzzle.py

      - name: 离线套件 parser
        run: uv run tests/test_parser.py

      - name: 离线套件 llm
        run: uv run tests/test_llm.py

      - name: 离线套件 engine
        run: uv run tests/test_engine.py

      - name: 离线套件 ingest
        run: uv run tests/test_ingest.py

      - name: 离线套件 web
        run: uv run tests/test_web.py

      # Step 05: 用 Step 00 冻结的真实 fixture 跑 canonical regression。
      # **只证明当前错误存在**, 不修 —— 修在 Step 07。
      - name: 离线套件 canonical
        run: uv run tests/test_canonical.py

      - name: 离线套件 pool
        run: uv run tests/test_pool.py

      - name: 离线套件 prefetch
        run: uv run tests/test_prefetch.py

      - name: 离线套件 playtest
        run: uv run tests/test_playtest.py

      # Step 10: PublicPlayerCore 的**结构性**隔离(签名反射 + 属性检查)。
      - name: 离线套件 public_player
        run: uv run tests/test_public_player.py

      # Step 12A: 守住「外部协议证据」这份文件的性质(非实测、字段编号与
      # 本地 proto 一致)。它防的是后续模型把猜测洗成证据。
      - name: 离线套件 protocol_evidence
        run: uv run tests/test_protocol_evidence.py

      # Step 13A: SummonLedger(Like high-water + 通用账本)。礼物不换算。
      - name: 离线套件 summon
        run: uv run tests/test_summon.py

      # Step 12B: 本地生成的 WS bootstrap(纯函数, 外部实现用法)。
      - name: 离线套件 ws_bootstrap
        run: uv run tests/test_ws_bootstrap.py

      # 12B-Auth: WS handshake 的登录态 Cookie(匿名/登录合并 + 防泄漏)。
      # 防泄漏那几条是硬要求: 凭据不得进 repr / 日志 / 异常 / stdout。
      - name: 离线套件 ws_cookie
        run: uv run tests/test_ws_cookie.py

      # Solve UX: 通关合同(v5)的**产品语义**回归 —— 房间共同推理、
      # human-only established、Reviewer 四项 fail-closed、确定性揭晓、
      # 运行时身份包含合同。Cases A~M, 全部去身份化的最小构造。
      - name: 离线套件 solve_ux
        run: uv run tests/test_solve_ux.py

      # 单元测试覆盖不到的**装配**问题(线程/端口/信号/落盘接线)。
      # director 是常驻进程, 没有"跑完就退出"的模式, 所以用 timeout 兜底:
      # 正常情况一定是被 timeout 杀掉的(退出码 124), 那时看日志判定。
      # 真正的失败是启动即崩(非 0/124 的退出码)或日志里出现 Traceback。
      #
      # 用 tests/fixtures/ 里的脚本, **不要**用 data/demo_script.jsonl ——
      # 后者被 .gitignore 忽略, CI 上根本不存在。
      - name: 装配冒烟(no-llm sim, 限时)
        run: |
          set +e
          timeout 25 uv run director.py \
            --sim tests/fixtures/smoke_script.jsonl --no-llm --no-window \
            --reveal-hold 3 --max-puzzles 2 --log-file "" \
            > /tmp/smoke.log 2>&1
          code=$?
          set -e
          cat /tmp/smoke.log
          echo "---- exit=$code ----"
          if [ "$code" != "0" ] && [ "$code" != "124" ]; then
            echo "::error::冒烟启动失败(退出码 $code)"
            exit 1
          fi
          if grep -q "Traceback" /tmp/smoke.log; then
            echo "::error::冒烟日志里出现 Traceback"
            exit 1
          fi
          # 至少要走到"出题就位"——否则等于没跑起来就退了。
          if ! grep -q "题就位" /tmp/smoke.log; then
            echo "::error::冒烟没有产出任何一道题"
            exit 1
          fi
          echo "冒烟通过"
